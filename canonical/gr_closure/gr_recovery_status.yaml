postulate:
  id: ONE_COUPLING_UNIMODULAR_SPLIT_JET_PALATINI
  status: CANONICAL_ON_MERGE
  action: S_G=(1/(4*kappa))*int epsilon_abcd E^a wedge E^b wedge R^cd(omega) -(1/kappa)*int Lambda*(nu_E-dC3)
  parameter_rule: kappa is the sole independent continuous action coupling; N0 is unit-setting only; Lambda is an on-shell integration constant rather than a Lagrangian coupling
  cosmological_equation: dLambda=0
  volume_constraint: nu_E=dC3
closure_chain:
  - The split-jet composite tetrad has no independent tetrad field and its algebraic variation map is surjective onto all tetrad directions on every regular non-null patch.
  - Variation of C3 gives dLambda=0, so Lambda=Lambda0 is constant on each connected local patch.
  - Variation of Lambda gives the covariant volume constraint nu_E=dC3 without introducing a fixed background volume form.
  - Surjective split-jet variation imposes the complete Palatini tetrad equation epsilon_abcd E^b wedge (R^cd-(Lambda/3)E^c wedge E^d)=0.
  - On that tetrad equation, the chain-rule contribution in the physical connection variation vanishes and the remaining Cartan equation has an invertible torsion map.
  - In spinless vacuum T=0 and omega is the Levi-Civita spin connection.
  - The resulting metric equation is G_munu+Lambda0*g_munu=0.
  - Every regular local Einstein solution with any constant Lambda0 has an explicit split-jet lift; on a contractible four-dimensional patch its volume four-form is locally exact and admits C3 with dC3=nu_E.
recovery_gaps:
  GAP-10K:
    status: CLOSED
    reason: Nondegenerate tetrad-to-metric rank is ten with six Lorentz gauge directions.
  GAP-10Omega-KIN:
    status: CLOSED
    reason: Specified tetrad and torsion uniquely determine the metric-compatible frame connection.
  GAP-10Omega-GR:
    status: CLOSED
    reason: Vacuum Cartan dynamics gives zero torsion and the unique Levi-Civita connection.
  GAP-10T-PALATINI:
    status: CLOSED
    reason: The adopted gravity law contains the Palatini connection variation and the 24-component Cartan map is pointwise invertible.
  GAP-10T-JET-KIN:
    status: CLOSED_LOCALLY
    reason: Every smooth local GR tetrad has the explicit non-null split-jet right inverse.
  GAP-10T-JET-AUX:
    status: CLOSED
    reason: The jet variables are algebraic/nonpropagating and the variation map to the tetrad is rank four.
  GAP-10T-JET-DYN:
    status: CLOSED_FOR_LOCAL_GRAVITY
    reason: In the adopted action the split-jet variables occur inside the gravitational functional; their surjective variation enforces the entire Einstein-Lambda tetrad equation.
  GAP-10T-DYN:
    status: CLOSED_FOR_LOCAL_VACUUM_GRAVITY
    reason: The physical connection equation reduces to the Cartan equation after the tetrad equation and selects Levi-Civita in spinless vacuum.
  GAP-10L-CONN:
    status: CLOSED
    reason: The adopted connection is Lorentz-valued and preserves the Lorentz metric/slice.
  GAP-10L-DYN:
    status: CLOSED_WITHIN_THE_CLASSICAL_GR_SECTOR
    reason: The gravity postulate is locally Lorentz covariant on the declared Lorentz-real classical sector; UV evolution away from that sector is a stronger full-theory question.
  GAP-10I-CURVED:
    status: CLOSED_LOCALLY_FOR_GRAVITY
    reason: Every regular local Einstein-Lambda tetrad has a single-Theta split-jet representative while physical curvature remains Levi-Civita on shell.
  GAP-10D-PALATINI:
    status: CLOSED
    reason: The adopted one-coupling action gives the Hilbert-Palatini tetrad and Cartan equations with Lambda generated as integration data.
  GAP-10D-UNIQUENESS:
    status: CLOSED_FOR_THE_ADOPTED_BRANCH
    reason: The branch is the declared dynamical law of the gravity sector; no second continuous action coupling is admitted.
  GAP-10D:
    status: CLOSED_AS_ONE_COUPLING_GRAVITY
    reason: Newton response is represented by the sole allowed continuous action coupling kappa; Lambda0 is integration/state data rather than a second coupling.
  GAP-10psi:
    status: NOT_A_LOCAL_GRAVITY_BLOCKER
    reason: The local classical theorem is a declared Lorentz-real GR sector. UV psi stability belongs to full-theory completion.
  GAP-U2Theta:
    status: CLOSED_LOCALLY
    reason: Schwarzschild, de Sitter, Schwarzschild-de Sitter and every other regular local Einstein-Lambda solution lift through the split-jet solution-set equivalence; the invalid legacy direct ansatz remains superseded.
  GAP-B-MASTER:
    status: CLOSED_FOR_CLASSICAL_GR_PERTURBATIONS
    reason: Linearization of the adopted Einstein-Lambda branch gives the standard local linearized Einstein system on the chosen GR background and the corresponding classical perturbation reductions.
nonblocking_full_theory_questions:
  UBT-FULL-ACTION:
    status: OPEN
    scope: Finalize the unique action including gauge, matter and quantum reductions without separately normalized fundamental sector actions.
  UBT-SOURCE-REDUCTION:
    status: OPEN
    scope: Derive the microscopic source/matter stress tensor from the same unique UBT action; kappa must remain the sole gravitational response coupling.
  UBT-LAMBDA-NUMERICAL-SELECTION:
    status: OPEN_COSMOLOGY
    scope: Derive or select the observed tiny positive value of the integration constant Lambda0 from global, topological, vacuum or quantum state data. The first-pass UBT zeta vacuum-energy estimate does not supply the required 120-order suppression.
  UBT-FUND-GLOBAL:
    status: OPEN
    scope: Establish a regular atlas through X^2=0 patches, horizons/caustics and nontrivial global topology.
  UBT-UV-PSI-STABILITY:
    status: OPEN
    scope: Prove stability and physical selection of the psi sector in the full microscopic theory.
  UBT-RPSI-ABSOLUTE-SCALE:
    status: OPEN
    scope: The historical logarithmic one-loop potential has no finite stationary point; modular self-duality can fix a ratio but not the absolute length scale as currently written.
forbidden_wording:
  - the older kinematic axioms alone uniquely forced the gravitational action
  - Newton constant is predicted numerically with zero input constants
  - the observed numerical cosmological constant has already been predicted
  - Lambda is fixed to zero by the closed GR branch
  - the legacy Schwarzschild ansatz is a valid canonical single-Theta solution
  - the full Standard Model and quantum UBT action are already closed
allowed_summary:
  - After adoption of the one-coupling unimodular split-jet Palatini dynamical postulate, local classical single-Theta Einstein-Lambda recovery is CLOSED on regular non-null patches with kappa as the sole independent continuous action coupling and Lambda0 as an integration constant.
