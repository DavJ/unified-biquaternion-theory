status_upgrade_audit:
  requested_target: CLOSED
  decision: RETAIN_CLOSED_CONDITIONALLY
  reason: Current kinematic axioms admit an arbitrary Einstein-Hilbert coefficient, including zero; the direct quadratic composite-Theta first-jet scalar collapses to a volume term and supplies no selector.
  theorem_critical_verification:
    exact_checker: tools/verify_gr_unconditional_closure.py
    lean_status: PROVED_FOR_ENCODED_ALGEBRAIC_CORE
    lean_version: 4.33.1
    mathlib_version: 4.33.1
    lean_artifacts:
      - formal/lean/UBT/GR/CompositeKinetic.lean
      - formal/lean/UBT/GR/CurvatureUnderdetermination.lean
    limitation: The formal proofs establish the contraction and logical underdetermination implications from explicit premises; they do not derive the microscopic selector, composite Hessian, constrained measure, or psi stability.
assumptions:
  - The infrared effective action contains a finite positive renormalized Einstein-Hilbert coefficient and the stated matter sector.
  - The split-jet construction is used only on regular non-null local patches and its auxiliary multiplier is eliminated on shell.
  - The physical spacetime connection in the recovered GR branch is Levi-Civita.
  - Higher-derivative corrections are negligible at the infrared order being claimed.
recovery_gaps:
  GAP-10T-JET-DYN:
    status: CLOSED_CONDITIONALLY_FOR_GR_RECOVERY
    reason: The split-jet variables are algebraic and nonpropagating; the Einstein-Hilbert term supplies the non-surjective metric selector in the effective branch.
  GAP-10T-DYN:
    status: CLOSED_CONDITIONALLY_FOR_GR_RECOVERY
    reason: The physical connection is Levi-Civita and auxiliary jet variables decouple on shell in the effective action.
  GAP-10L-DYN:
    status: CLOSED_CONDITIONALLY_FOR_GR_RECOVERY
    reason: The effective tetrad/metric action is local-Lorentz covariant and uses the already proved Lorentz-compatible connection sector.
  GAP-10I-CURVED:
    status: CLOSED_LOCALLY_FOR_GR_RECOVERY
    reason: Every smooth local GR tetrad admits the split-jet right inverse while the physical curvature remains Levi-Civita.
  GAP-10D:
    status: CLOSED_CONDITIONALLY_FOR_GR_RECOVERY
    reason: GR recovery requires a finite renormalized Newton coefficient, not a first-principles numerical prediction of that coefficient; the two-derivative effective action is Einstein-Lambda under the stated spectral/Hessian assumptions.
  GAP-10psi:
    status: NOT_A_GR_RECOVERY_BLOCKER
    reason: The recovered four-dimensional GR branch is the psi-stable/zero-mode infrared sector; derivation of its UV stability is a stronger fundamental-completion problem.
  GAP-U2Theta:
    status: CLOSED_CONDITIONALLY_FOR_GR_RECOVERY
    reason: Every local Schwarzschild tetrad including the lapse is an Einstein vacuum solution and therefore lifts, by the split-jet theorem with vanishing on-shell multiplier, to the effective UBT GR branch.
  GAP-B-MASTER:
    status: CLOSED_CONDITIONALLY_FOR_GR_RECOVERY
    reason: Linearization of the recovered Einstein branch about Schwarzschild gives the standard linearized Einstein system and the already documented Regge-Wheeler/Zerilli reductions.
open_fundamental_nonblocking_questions:
  UBT-FUND-GR-ACTION:
    status: OPEN
    scope: Derive the complete effective metric selector from a finalized microscopic Theta-only action rather than adopt/induce it conditionally.
  UBT-UV-G-PREDICTION:
    status: OPEN
    scope: Derive the composite gauge-fixed Hessian, physical mode count, curvature coupling, cutoff identification, and constrained measure needed to predict Newton's constant rather than recover GR with a renormalized G.
  UBT-FUND-PDE:
    status: OPEN
    scope: Prove well-posedness and symmetry propagation for the finalized microscopic Theta equations.
  UBT-FUND-GLOBAL:
    status: OPEN
    scope: Establish global Theta/auxiliary patching across null patches, caustics, horizons, and nontrivial topology.
  UBT-UV-PSI-STABILITY:
    status: OPEN
    scope: Derive the physical psi-sector stability and exclude unstable UV modes from the microscopic dynamics.
  UBT-FUND-PERTURBATION:
    status: OPEN
    scope: Derive the same infrared perturbation operator directly from the original microscopic master equation rather than from the recovered Einstein effective action.
forbidden_wording:
  - GR is derived unconditionally from microscopic UBT
  - Newton constant is predicted from UBT without spectral and measure assumptions
  - the legacy Schwarzschild ansatz is a valid canonical single-Theta solution
  - all fundamental UBT completion problems are solved
