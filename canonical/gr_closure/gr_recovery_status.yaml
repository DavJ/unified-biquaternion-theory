postulate:
  id: POINCARE_CONTRACTED_FIFTH_CHANNEL_SPLIT_JET_PALATINI
  status: CANONICAL_ON_MERGE
  action: S_G=(1/(4*kappa))*int epsilon_abcd E^a wedge E^b wedge R^cd(omega)
  origin: finite local/topologically-subtracted ell->infinity contraction of the fifth-channel graded curvature-square candidate
  parameter_rule: kappa is the sole continuous gravitational coupling; N0 is unit-setting only; no independent bare Lambda is allowed
  prediction: Lambda_bare=0
closure_chain:
  - The canonical fifth Clifford channel gives the graded epsilon_abcd trace and the de Sitter/anti-de Sitter curvature-square parent candidate.
  - Subtracting the Euler density changes no local bulk equations on fixed topology.
  - The Poincare contraction ell->infinity removes the cosmological E^4 coefficient and leaves the Hilbert-Palatini EER term with one coefficient kappa.
  - The split-jet auxiliary variation is surjective onto all four tetrad directions and therefore imposes the complete Palatini tetrad equation rather than an adjoint projection.
  - On that tetrad equation, the chain-rule contribution in the physical connection variation vanishes and the remaining Cartan equation has an invertible torsion map.
  - In spinless vacuum T=0 and omega is the Levi-Civita spin connection.
  - The Theta variation is a differential consequence of the complete tetrad equation, and every regular local Palatini solution has an explicit split-jet lift.
recovery_gaps:
  GAP-10K:
    status: CLOSED
    reason: Nondegenerate tetrad-to-metric rank is ten with six Lorentz gauge directions.
  GAP-10Omega-KIN:
    status: CLOSED
    reason: Specified tetrad and torsion uniquely determine the metric-compatible frame connection.
  GAP-10Omega-GR:
    status: CLOSED
    reason: Vacuum Cartan dynamics of the adopted gravity postulate gives zero torsion and the unique Levi-Civita connection.
  GAP-10T-PALATINI:
    status: CLOSED
    reason: The adopted gravity law contains the Palatini connection variation and the 24-component Cartan map is pointwise invertible.
  GAP-10T-JET-KIN:
    status: CLOSED_LOCALLY
    reason: Every smooth local GR tetrad has the explicit non-null split-jet right inverse.
  GAP-10T-JET-AUX:
    status: CLOSED
    reason: The jet variables are algebraic/nonpropagating and the variation map to the tetrad is rank four.
  GAP-10T-JET-DYN:
    status: CLOSED_FOR_LOCAL_GRAVITY
    reason: In the adopted action the split-jet variables occur inside the gravitational functional; their surjective variation enforces the entire tetrad Einstein equation.
  GAP-10T-DYN:
    status: CLOSED_FOR_LOCAL_VACUUM_GRAVITY
    reason: The physical connection equation reduces to the Cartan equation after the tetrad equation and selects Levi-Civita in vacuum.
  GAP-10L-CONN:
    status: CLOSED
    reason: The adopted connection is Lorentz-valued and preserves the Lorentz metric/slice.
  GAP-10L-DYN:
    status: CLOSED_WITHIN_THE_CLASSICAL_GR_SECTOR
    reason: The gravity postulate is locally Lorentz covariant on the declared Lorentz-real classical sector; UV evolution away from that sector is a stronger full-theory question.
  GAP-10I-CURVED:
    status: CLOSED_LOCALLY_FOR_GRAVITY
    reason: Every regular local GR tetrad has a single-Theta split-jet representative while physical curvature remains Levi-Civita on shell.
  GAP-10D-PALATINI:
    status: CLOSED
    reason: The gravitational dynamical postulate is the one-constant Hilbert-Palatini law, obtained as the local Poincare contraction of the fifth-channel parent candidate.
  GAP-10D-UNIQUENESS:
    status: CLOSED_FOR_THE_ADOPTED_BRANCH
    reason: The branch is not selected by kinematics; it is the declared dynamical law of the gravity sector. No second local two-derivative gravity coupling is admitted.
  GAP-10D:
    status: CLOSED_AS_ONE_CONSTANT_GRAVITY
    reason: Newton response is represented by the sole allowed continuous gravity constant kappa. A fundamental theory is not required to derive the numerical value of its one permitted constant from kinematics.
  GAP-10psi:
    status: NOT_A_LOCAL_GRAVITY_BLOCKER
    reason: The local classical theorem is a declared Lorentz-real GR sector. UV psi stability belongs to full-theory completion.
  GAP-U2Theta:
    status: CLOSED_LOCALLY
    reason: Schwarzschild and every other regular local zero-bare-Lambda GR solution lift through the split-jet solution-set equivalence; the invalid legacy direct ansatz remains superseded.
  GAP-B-MASTER:
    status: CLOSED_FOR_CLASSICAL_GR_PERTURBATIONS
    reason: Linearization of the adopted Einstein branch gives the standard local linearized Einstein system and existing Regge-Wheeler/Zerilli reductions.
nonblocking_full_theory_questions:
  UBT-FULL-ACTION:
    status: OPEN
    scope: Finalize the unique action including gauge, matter and quantum reductions without separately normalized fundamental sector actions.
  UBT-SOURCE-REDUCTION:
    status: OPEN
    scope: Derive the microscopic source/matter stress tensor from the same unique UBT action; kappa must remain the sole gravitational response coupling.
  UBT-EFFECTIVE-DARK-ENERGY:
    status: OPEN
    scope: Derive any observed nonzero effective cosmological term from the Theta vacuum/quantum/boundary sector; the adopted gravity postulate has Lambda_bare=0 and no free Lambda.
  UBT-FUND-GLOBAL:
    status: OPEN
    scope: Establish a regular atlas through X^2=0 patches, horizons/caustics and nontrivial global topology.
  UBT-UV-PSI-STABILITY:
    status: OPEN
    scope: Prove stability and physical selection of the psi sector in the full microscopic theory.
  UBT-RPSI-ABSOLUTE-SCALE:
    status: OPEN
    scope: The historical logarithmic one-loop potential has no finite stationary point; modular self-duality can fix a ratio but not the absolute length scale as currently written.
forbidden_wording:
