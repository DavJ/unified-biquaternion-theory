superseded_claim:
  path: canonical/geometry/biquaternionic_vacuum_solutions.tex
  section: Full Schwarzschild Vacuum Solution
  former_status: Proved [L1]
  verdict: INVALID_AS_CANONICAL_DERIVATION
reasons:
  - The displayed ansatz exp(i*alpha(r))*X(r) has no psi dependence, so its psi derivative is zero rather than i*alpha(r)*Theta.
  - Differentiating the radial phase contributes i*alpha_prime(r)*(x_i/r)*X to every spatial derivative; the claimed phase cancellation omits this term.
  - The phase-free numerical checker uses real-quaternion spatial derivatives whose scalar coefficient is generically real and nonzero, so those derivatives do not lie in the canonical Lorentz slice W_L.
  - The asserted unit norm is incompatible with g(r)=r*(1+M/(2r))^2; at M=1 and r=2, g(r)=25/8 and hence the real-quaternion norm cannot equal one.
valid_scope:
  - The phase-free legacy ansatz satisfies the Euclidean spatial identity g_ij=Psi^4*delta_ij under its stated scalar readout.
  - The composite-contortion theorem supplies local kinematic representability of a prescribed Schwarzschild tetrad, but generally with nonzero composite torsion and without action-level selection.
  - The split-jet theorem supplies local representability while physical curvature remains Levi-Civita, but its surjective auxiliary constraint cannot select the tetrad.
not_proved:
  - canonical on-shell generation of the complete Schwarzschild tetrad and lapse
  - a preferred psi section or phase prescription
  - global or horizon continuation
verification:
