name: Build textbook PDFs (compatibility wrapper)

# The repository-wide LaTeX workflow already compiles these roots on every
# master push. This manual wrapper exists for focused textbook iteration and
# uses the same non-fail-fast compiler and report format.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-textbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            latexmk biber python3-pygments \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-science \
            texlive-xetex texlive-luatex texlive-bibtex-extra
      - name: Build every standalone textbook root
        run: |
          python3 tools/latex_audit.py \
            --include 'docs/textbook/*.tex' \
            --include 'docs/textbook/**/*.tex' \
            --jobs 2 --timeout 240
      - name: Upload textbook PDFs and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: textbook-latex-${{ github.run_id }}
          path: |
            build/latex-audit/pdfs/docs/textbook/**/*.pdf
            reports/latex_build/**
          if-no-files-found: warn
