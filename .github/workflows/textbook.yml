name: Build textbook PDFs

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'docs/textbook/**'
      - 'canonical/**'
      - 'tex/**'
      - 'tools/latex_audit.py'
      - 'tools/apply_provenance_headers.py'
      - 'AI_PROVENANCE.md'
      - 'PROVENANCE_TIERS.yaml'
      - '.github/workflows/textbook.yml'
  pull_request:
    paths:
      - 'docs/textbook/**'
      - 'canonical/**'
      - 'tex/**'
      - 'tools/latex_audit.py'
      - 'tools/apply_provenance_headers.py'
      - 'AI_PROVENANCE.md'
      - 'PROVENANCE_TIERS.yaml'
      - '.github/workflows/textbook.yml'

permissions:
  contents: read

jobs:
  build-textbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            latexmk biber python3-pygments \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-science \
            texlive-xetex texlive-luatex texlive-bibtex-extra
      - name: Check AI provenance markers
        run: python3 tools/apply_provenance_headers.py --check
      - name: Build every standalone textbook root (strict)
        env:
          TEXINPUTS: ${{ github.workspace }}/tex//:
        run: |
          python3 tools/latex_audit.py \
            --include 'docs/textbook/*.tex' \
            --include 'docs/textbook/**/*.tex' \
            --jobs 2 --timeout 240 --strict
      - name: Build stable textbook PDF set
        run: make -C docs/textbook verify
      - name: Upload textbook PDFs and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubt-textbook-pdfs-${{ github.run_id }}
          path: |
            build/textbook/public/*.pdf
            reports/latex_build/**
          if-no-files-found: error
