name: Build textbook PDF

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'docs/textbook/**'
      - 'canonical/**'
      - 'tex/**'
      - 'tools/latex_audit.py'
      - 'tools/apply_provenance_headers.py'
      - 'tools/mark_latex_audit_report.py'
      - 'AI_PROVENANCE.md'
      - 'PROVENANCE_TIERS.yaml'
      - '.github/workflows/textbook.yml'
  pull_request:
    paths:
      - 'docs/textbook/**'
      - 'canonical/**'
      - 'tex/**'
      - 'tools/latex_audit.py'
      - 'tools/apply_provenance_headers.py'
      - 'tools/mark_latex_audit_report.py'
      - 'AI_PROVENANCE.md'
      - 'PROVENANCE_TIERS.yaml'
      - '.github/workflows/textbook.yml'

permissions:
  contents: write

jobs:
  build-textbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync master checkout for push reruns
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: git pull --ff-only origin master

      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            latexmk biber python3-pygments \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-science texlive-lang-czechslovak \
            texlive-xetex texlive-luatex texlive-bibtex-extra
          python3 -m pip install --upgrade pip
          python3 -m pip install pyyaml

      - name: Normalize checked-in generated audit provenance
        run: python3 tools/mark_latex_audit_report.py

      - name: Check AI provenance markers
        run: python3 tools/apply_provenance_headers.py --check

      - name: Check bilingual document parity
        run: python3 tools/check_bilingual_pairs.py --root .

      - name: Audit standalone textbook roots
        env:
          TEXINPUTS: "${{ github.workspace }}/tex//:"
        run: |
          python3 tools/latex_audit.py \
            --include 'docs/textbook/*.tex' \
            --include 'docs/textbook/**/*.tex' \
            --jobs 2 --timeout 240 --strict

      - name: Mark generated textbook audit provenance
        if: always()
        run: python3 tools/mark_latex_audit_report.py

      - name: Build official textbook PDF
        run: make -C docs/textbook verify

      - name: Publish official PDF into repository tree
        run: make -C docs/textbook publish

      - name: Verify official textbook PDFs
        run: |
          test -s build/textbook/public/UBT_Textbook_CS.pdf
          test -s build/textbook/public/UBT_Textbook_EN.pdf
          test "$(find build/textbook/public -maxdepth 1 -type f -name 'UBT_Textbook_*.pdf' | wc -l)" -eq 2

      - name: Upload official Czech textbook PDF
        uses: actions/upload-artifact@v4
        with:
          name: UBT_Textbook_CS
          path: build/textbook/public/UBT_Textbook_CS.pdf
          if-no-files-found: error

      - name: Upload official English textbook PDF
        uses: actions/upload-artifact@v4
        with:
          name: UBT_Textbook_EN
          path: build/textbook/public/UBT_Textbook_EN.pdf
          if-no-files-found: error
      - name: Commit refreshed textbook PDF
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          if git diff --quiet -- docs/pdfs/UBT_Textbook_CS.pdf docs/pdfs/UBT_Textbook_EN.pdf; then
            echo 'Bilingual textbook PDFs are unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/pdfs/UBT_Textbook_CS.pdf docs/pdfs/UBT_Textbook_EN.pdf
          git commit -m 'docs: refresh bilingual UBT textbook PDFs [skip ci]'
          git push origin HEAD:master

      - name: Validate textbook email secrets
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          TEXTBOOK_EMAIL_TO: ${{ secrets.TEXTBOOK_EMAIL_TO }}
          TEXTBOOK_SMTP_USERNAME: ${{ secrets.TEXTBOOK_SMTP_USERNAME }}
          TEXTBOOK_SMTP_APP_PASSWORD: ${{ secrets.TEXTBOOK_SMTP_APP_PASSWORD }}
        run: |
          test -n "$TEXTBOOK_EMAIL_TO"
          test -n "$TEXTBOOK_SMTP_USERNAME"
          test -n "$TEXTBOOK_SMTP_APP_PASSWORD"

      - name: Email official textbook PDFs
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          TEXTBOOK_EMAIL_TO: ${{ secrets.TEXTBOOK_EMAIL_TO }}
          TEXTBOOK_SMTP_USERNAME: ${{ secrets.TEXTBOOK_SMTP_USERNAME }}
          TEXTBOOK_SMTP_APP_PASSWORD: ${{ secrets.TEXTBOOK_SMTP_APP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage
          from pathlib import Path

          pdfs = [Path('build/textbook/public/UBT_Textbook_CS.pdf'), Path('build/textbook/public/UBT_Textbook_EN.pdf')]
          if any(not pdf.is_file() or pdf.stat().st_size == 0 for pdf in pdfs):
              raise SystemExit('One or more bilingual textbook PDFs are missing or empty')

          msg = EmailMessage()
          msg['Subject'] = 'UBT Textbooks (CS + EN)'
          msg['From'] = os.environ['TEXTBOOK_SMTP_USERNAME']
          msg['To'] = os.environ['TEXTBOOK_EMAIL_TO']
          msg.set_content('Attached are the latest successfully built Czech and English UBT textbook PDFs.')
          for pdf in pdfs:
              msg.add_attachment(pdf.read_bytes(), maintype='application', subtype='pdf', filename=pdf.name)

          with smtplib.SMTP_SSL('smtp.gmail.com', 465, timeout=30) as smtp:
              smtp.login(
                  os.environ['TEXTBOOK_SMTP_USERNAME'],
                  os.environ['TEXTBOOK_SMTP_APP_PASSWORD'],
              )
              smtp.send_message(msg)
          PY
