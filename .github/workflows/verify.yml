name: Verify Lorentz Invariance
on:
  push:
    branches: [ main, master ]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt scipy matplotlib pytest
      - name: Run symbolic Lorentz invariance verification
        run: |
          python tools/sympy_verify_lorentz_norm.py --verbose
      - name: Run pytest
        run: |
          pytest -q
