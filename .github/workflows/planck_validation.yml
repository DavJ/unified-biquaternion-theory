name: Planck Validation Tests

on:
  push:
    branches: [ main, master ]
    paths:
      - 'tools/planck_validation/**'
      - 'experiments/planck.py'
      - 'tests/test_planck_validation_mapping.py'
      - 'tests/test_planck_model_validation.py'
      - 'tests/test_planck_units_and_strict_mode.py'
      - '.github/workflows/planck_validation.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'tools/planck_validation/**'
      - 'experiments/planck.py'
      - 'tests/test_planck_validation_mapping.py'
      - 'tests/test_planck_model_validation.py'
      - 'tests/test_planck_units_and_strict_mode.py'
      - '.github/workflows/planck_validation.yml'

jobs:
  test-planck-validation:
    name: Test Planck Validation Mappings
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy scipy

      - name: Run active Planck validation tests
        run: |
          pytest -q \
            tests/test_planck_validation_mapping.py \
            tests/test_planck_model_validation.py \
            tests/test_planck_units_and_strict_mode.py

      - name: Test summary
        if: always()
        run: |
          echo "================================================================"
          echo "UBT Planck Validation Tests Complete"
          echo "================================================================"
          echo "The suite enforces locked constants, explicit mappings, and strict failure for TBD mappings."
