name: Forensic Fingerprint Tests

on:
  push:
    branches: [ main, master ]
    paths:
      - 'tools/forensic_fingerprint/**'
      - 'experiments/forensic_fingerprint/**'
      - 'experiments/planck.py'
      - 'tests/test_forensic_fingerprint.py'
      - 'tests/test_planck_units_and_strict_mode.py'
      - '.github/workflows/forensic_fingerprint.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'tools/forensic_fingerprint/**'
      - 'experiments/forensic_fingerprint/**'
      - 'experiments/planck.py'
      - 'tests/test_forensic_fingerprint.py'
      - 'tests/test_planck_units_and_strict_mode.py'
      - '.github/workflows/forensic_fingerprint.yml'

jobs:
  test-forensic-fingerprint:
    name: Test Forensic Fingerprint Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy scipy matplotlib

      - name: Smoke test active forensic_fingerprint package
        run: |
          python -c "import sys; sys.path.insert(0, 'tools'); import forensic_fingerprint; print('Package loaded:', forensic_fingerprint.__file__)"

      - name: Run forensic fingerprint tests
        run: |
          pytest -q \
            tests/test_forensic_fingerprint.py \
            tests/test_planck_units_and_strict_mode.py

      - name: Test summary
        if: always()
        run: |
          echo "================================================"
          echo "UBT Forensic Fingerprint Tests Complete"
          echo "================================================"
          echo "Synthetic-data validation only; real analysis requires external Planck/WMAP data."
          echo "See tools/forensic_fingerprint/README.md"
