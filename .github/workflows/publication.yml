name: Build publication PDFs (non-fail-fast)

on:
  push:
    branches: [master]
    paths:
      - 'publication/**'
      - 'docs/publication/**'
      - '.github/workflows/publication.yml'
      - 'tools/latex_audit.py'
  pull_request:
    branches: [master]
    paths:
      - 'publication/**'
      - 'docs/publication/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            latexmk biber python3-pygments \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-science \
            texlive-xetex texlive-luatex texlive-bibtex-extra
      - name: Compile all publication roots
        run: |
          python3 tools/latex_audit.py \
            --include 'publication/**/*.tex' \
            --include 'docs/publication/**/*.tex' \
            --jobs 2 --timeout 240
      - name: Upload publication PDFs and complete report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-latex-${{ github.run_id }}
          path: |
            build/latex-audit/pdfs/publication/**/*.pdf
            build/latex-audit/pdfs/docs/publication/**/*.pdf
            reports/latex_build/**
          if-no-files-found: warn
          retention-days: 90
