name: Build research and archived LaTeX PDFs

# Manual deep audit. The normal push workflow already compiles every active
# standalone TeX root. This dispatch additionally includes historical/legacy
# roots and records every failure without fail-fast behaviour.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Parallel LaTeX workers'
        required: false
        default: '4'
        type: string
      timeout:
        description: 'Timeout in seconds per document'
        required: false
        default: '180'
        type: string

jobs:
  deep-latex-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            latexmk biber python3-pygments \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-science \
            texlive-xetex texlive-luatex texlive-bibtex-extra
      - name: Compile active and archived roots
        run: |
          python3 tools/latex_audit.py \
            --repo . \
            --report-dir reports/latex_build \
            --build-dir build/latex-audit \
            --include-archive \
            --jobs '${{ inputs.jobs }}' \
            --timeout '${{ inputs.timeout }}'
      - name: Upload successful PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-latex-pdfs-${{ github.run_id }}
          path: build/latex-audit/pdfs/**/*.pdf
          if-no-files-found: warn
          retention-days: 30
      - name: Upload deep-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-latex-audit-${{ github.run_id }}
          path: reports/latex_build/
          if-no-files-found: error
          retention-days: 90
