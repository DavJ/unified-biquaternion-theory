name: Repo Integrity Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  repo-grounding-check:
    name: "Check Repo Grounding"
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fetch PR body
        id: pr_body
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "$BODY" > /tmp/pr_body.txt
          echo "PR body saved."

      - name: Verify Repo Grounding section exists
        run: |
          if ! grep -qi "## Repo Grounding" /tmp/pr_body.txt; then
            echo "::error::PR is missing the '## Repo Grounding' section. Add at least 2 path:line citations."
            exit 1
          fi
          echo "Repo Grounding section found."

      - name: Verify at least 2 path:line citations
        run: |
          # Match lines like: - `some/path:123` or - some/path:123
          COUNT=$(grep -cE '`?[a-zA-Z0-9_./-]+(\.[a-zA-Z0-9]+)?:[0-9]+`?' /tmp/pr_body.txt || true)
          echo "Found $COUNT path:line citation(s)."
          if [ "$COUNT" -lt 2 ]; then
            echo "::error::Repo Grounding requires at least 2 path:line citations (found $COUNT)."
            exit 1
          fi

  protected-paths-check:
    name: "Check Protected Paths"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes to protected paths
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          PROTECTED_PATHS="original_release_of_ubt canonical core unified_biquaternion_theory"

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || \
                    { echo "::warning::Could not diff against base SHA; falling back to HEAD~1"; \
                      git diff --name-only HEAD~1 HEAD 2>/dev/null || true; })

          echo "Changed files:"
          echo "$CHANGED"

          TOUCHED_PROTECTED=""
          for path in $PROTECTED_PATHS; do
            if echo "$CHANGED" | grep -q "^${path}/"; then
              TOUCHED_PROTECTED="$TOUCHED_PROTECTED $path"
            fi
          done

          if [ -n "$TOUCHED_PROTECTED" ]; then
            echo "Protected paths touched:$TOUCHED_PROTECTED"
            # Check for allow-core-change label
            if echo "$LABELS" | grep -q "allow-core-change"; then
              echo "Label 'allow-core-change' is present. Proceeding."
            else
              echo "::error::This PR modifies protected path(s) [$TOUCHED_PROTECTED] but is missing the 'allow-core-change' label."
              exit 1
            fi
          else
            echo "No protected paths modified."
          fi

  experiment-script-check:
    name: "Check Experiment Scripts"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Detect experiment scripts added/modified in this PR
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin "$BASE_SHA" --depth=1 2>/dev/null || true
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || \
                    { echo "::warning::Could not diff against base SHA; falling back to HEAD~1"; \
                      git diff --name-only HEAD~1 HEAD 2>/dev/null || true; })
          SCRIPTS=$(echo "$CHANGED" | grep -E '^experiments/.*\.py$' || true)
          echo "Experiment scripts changed:"
          echo "$SCRIPTS"
          echo "scripts<<EOF" >> "$GITHUB_OUTPUT"
          echo "$SCRIPTS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.detect.outputs.scripts != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.detect.outputs.scripts != ''
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run experiment scripts
        if: steps.detect.outputs.scripts != ''
        run: |
          FAILED=0
          while IFS= read -r script; do
            [ -z "$script" ] && continue
            echo "Running: python $script"
            if ! python "$script"; then
              echo "::error::Experiment script '$script' failed. Fix errors before merging."
              FAILED=1
            fi
          done <<< "${{ steps.detect.outputs.scripts }}"
          exit $FAILED

  size-and-binary-check:
    name: "Check Repository Size and Binary Files"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check no unwhitelisted PDFs are tracked
        run: |
          ALLOWED_PDFS=(
            "docs/pdfs/UBT_Textbook_CS.pdf"
            "docs/pdfs/UBT_Textbook_EN.pdf"
            "docs/pdfs/UBT_canonical_main.pdf"
            "docs/pdfs/UBT_GR_Submission.pdf"
          )
          ALL_PDFS=$(git ls-files -- "*.pdf")
          FAILED=0
          while IFS= read -r pdf; do
            [ -z "$pdf" ] && continue
            FOUND=0
            for allowed in "${ALLOWED_PDFS[@]}"; do
              if [ "$pdf" = "$allowed" ]; then FOUND=1; break; fi
            done
            if [ "$FOUND" -eq 0 ]; then
              echo "::error::Tracked PDF outside whitelist: $pdf"
              FAILED=1
            fi
          done <<< "$ALL_PDFS"
          [ "$FAILED" -eq 0 ] || exit 1
          echo "PDF check passed ($(echo "$ALL_PDFS" | grep -c . || echo 0) tracked PDFs, all whitelisted)."

      - name: Check no latex build logs are tracked
        run: |
          LOGS=$(git ls-files -- "reports/latex_build/logs/**" 2>/dev/null || true)
          if [ -n "$LOGS" ]; then
            echo "::error::Tracked latex build logs found (should be .gitignored):"
            echo "$LOGS"
            exit 1
          fi
          echo "No tracked build logs found."

      - name: Check no Parquet files in prime_mod24 project
        run: |
          PARQUETS=$(git ls-files -- "projects/prime_mod24_resonance/**/*.parquet" 2>/dev/null || true)
          if [ -n "$PARQUETS" ]; then
            echo "::error::Tracked Parquet files found in prime_mod24 project:"
            echo "$PARQUETS"
            exit 1
          fi
          echo "No tracked Parquet files found."

      - name: Check individual new binary files do not exceed 500 kB
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin "$BASE_SHA" --depth=1 2>/dev/null || true
          ADDED=$(git diff --name-only --diff-filter=A "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || \
                  git diff --name-only --diff-filter=A HEAD~1 HEAD 2>/dev/null || true)
          FAILED=0
          EXEMPT_PDFS=(
            "docs/pdfs/UBT_Textbook_CS.pdf"
            "docs/pdfs/UBT_Textbook_EN.pdf"
            "docs/pdfs/UBT_canonical_main.pdf"
            "docs/pdfs/UBT_GR_Submission.pdf"
          )
          while IFS= read -r f; do
            [ -z "$f" ] || [ ! -f "$f" ] && continue
            SIZE=$(stat -c %s "$f" 2>/dev/null || echo 0)
            if [ "$SIZE" -gt 512000 ]; then
              # Check if it's an explicitly exempted whitelisted PDF
              EXEMPT=0
              for ep in "${EXEMPT_PDFS[@]}"; do
                [ "$f" = "$ep" ] && EXEMPT=1 && break
              done
              if [ "$EXEMPT" -eq 0 ]; then
                echo "::error::New binary file exceeds 500 kB: $f (${SIZE} bytes). Add an explicit exception or use a CI artifact instead."
                FAILED=1
              fi
            fi
          done <<< "$ADDED"
          [ "$FAILED" -eq 0 ] || exit 1
          echo "Binary size check passed."

      - name: Check git archive size does not exceed 12 MiB
        run: |
          ZIP_SIZE=$(git archive --format=zip HEAD | wc -c)
          echo "git archive ZIP size: ${ZIP_SIZE} bytes ($(( ZIP_SIZE / 1048576 )) MiB)"
          if [ "$ZIP_SIZE" -gt 12582912 ]; then
            echo "::error::git archive HEAD exceeds 12 MiB (${ZIP_SIZE} bytes). Clean up large or generated files before merging."
            exit 1
          fi
          echo "Archive size check passed."
