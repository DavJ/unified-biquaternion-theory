name: Build all LaTeX PDFs

permissions:
  contents: write

on:
  push:
    branches: [master]
    paths-ignore:
      - 'reports/latex_build/**'
      - 'docs/pdfs/**'
  pull_request:
  workflow_dispatch:
    inputs:
      include_archive:
        description: 'Also compile archived and legacy standalone TeX roots'
        required: false
        default: false
        type: boolean
      jobs:
        description: 'Parallel LaTeX workers'
        required: false
        default: '4'
        type: string
      timeout:
        description: 'Timeout in seconds per document'
        required: false
        default: '180'
        type: string

concurrency:
  group: latex-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-all:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            latexmk biber python3-pygments \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-science \
            texlive-xetex texlive-luatex texlive-bibtex-extra

      - name: Compile every standalone TeX root
        shell: bash
        env:
          DISPATCH_INCLUDE_ARCHIVE: ${{ inputs.include_archive || false }}
          DISPATCH_JOBS: ${{ inputs.jobs || '4' }}
          DISPATCH_TIMEOUT: ${{ inputs.timeout || '180' }}
        run: |
          set -uo pipefail
          args=(
            --repo .
            --report-dir reports/latex_build
            --build-dir build/latex-audit
            --jobs "$DISPATCH_JOBS"
            --timeout "$DISPATCH_TIMEOUT"
          )
          if [[ "$DISPATCH_INCLUDE_ARCHIVE" == "true" ]]; then
            args+=(--include-archive)
          fi
          # Document-level failures are recorded by the tool and never stop the
          # remaining compilation queue. Infrastructure errors still fail here.
          python3 tools/latex_audit.py "${args[@]}"

      - name: Publish curated canonical PDFs
        if: always()
        run: |
          python3 tools/publish_latex_pdfs.py \
            --repo . \
            --build-dir build/latex-audit/pdfs \
            --map .github/latex_publish_map.tsv

      - name: Upload all successful PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latex-pdfs-${{ github.run_id }}
          path: build/latex-audit/pdfs/**/*.pdf
          if-no-files-found: warn
          retention-days: 30

      - name: Upload complete LaTeX audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latex-audit-${{ github.run_id }}
          path: reports/latex_build/
          if-no-files-found: error
          retention-days: 90

      - name: Commit report and curated PDFs
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Never attach PDFs built from an older source tree to a newer human
          # commit.  Artifacts and logs have already been uploaded above; when
          # master advanced during this long build, the newer push will trigger
          # its own fresh audit.
          git fetch origin master
          remote_head="$(git rev-parse origin/master)"
          if [[ "$remote_head" != "$GITHUB_SHA" ]]; then
            echo "Master advanced from $GITHUB_SHA to $remote_head; refusing to commit stale PDFs/report."
            exit 0
          fi

          git add -f reports/latex_build
          git add docs/pdfs
          if git diff --cached --quiet; then
            echo "No report or PDF changes to commit"
            exit 0
          fi
          git commit -m "chore: refresh LaTeX audit and PDFs [skip ci]"
          git push origin HEAD:master
